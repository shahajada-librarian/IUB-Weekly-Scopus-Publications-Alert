<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IUB Scopus Publications Dashboard</title>
<style>
  :root {
    --navy: #0d2240;
    --gold: #c9a227;
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1d2733;
    --muted: #5c6b7a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--navy), #163257);
    color: #fff;
    padding: 28px 32px;
  }
  header h1 { margin: 0 0 4px; font-size: 24px; }
  header p { margin: 0; color: #cfd9e6; font-size: 14px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 32px;
    background: #fff;
    border-bottom: 1px solid #e3e8ee;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .controls input[type=text] {
    flex: 1 1 240px;
    padding: 9px 12px;
    border: 1px solid #d3dae3;
    border-radius: 6px;
    font-size: 14px;
  }
  .controls select {
    padding: 9px 12px;
    border: 1px solid #d3dae3;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  .stats {
    padding: 14px 32px 0;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid #e3e8ee;
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 130px;
    text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-card .label { font-size: 12px; color: var(--muted); }
  main { padding: 20px 32px 48px; display: flex; gap: 24px; align-items: flex-start; }
  #deptList {
    flex: 0 0 240px;
    background: var(--card-bg);
    border: 1px solid #e3e8ee;
    border-radius: 8px;
    overflow: hidden;
    position: sticky;
    top: 92px;
  }
  #deptList .dept-item {
    padding: 11px 14px;
    font-size: 13.5px;
    cursor: pointer;
    border-bottom: 1px solid #eef1f5;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #deptList .dept-item:hover { background: #f0f4f9; }
  #deptList .dept-item.active { background: var(--navy); color: #fff; }
  #deptList .dept-item .count {
    background: #e7edf5;
    color: var(--navy);
    border-radius: 10px;
    font-size: 11px;
    padding: 1px 8px;
    font-weight: 600;
  }
  #deptList .dept-item.active .count { background: var(--gold); color: #2a2103; }
  #cards { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .pub-card {
    background: var(--card-bg);
    border: 1px solid #e3e8ee;
    border-left: 5px solid var(--gold);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .pub-card h3 { margin: 0 0 6px; font-size: 16.5px; line-height: 1.35; }
  .pub-card h3 a { color: var(--navy); text-decoration: none; }
  .pub-card h3 a:hover { text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 12px;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .badge.dept { background: #e7edf5; color: var(--navy); }
  .badge.oa { background: #e6f6ea; color: #1e7a37; }
  .badge.type { background: #fdf1df; color: #93650c; }
  .authors { font-size: 13px; margin-bottom: 6px; }
  .authors .iub { font-weight: 700; color: var(--navy); }
  .footer-note { font-size: 11.5px; color: var(--muted); margin-top: 60px; text-align: center; }
  #empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>

let activeDept = "ALL";

function departmentCounts() {
  const map = {};
  PUBLICATIONS.forEach(p => { map[p.department] = (map[p.department] || 0) + 1; });
  return map;
}

function renderStats() {
  const total = PUBLICATIONS.length;
  const deptCount = Object.keys(departmentCounts()).length;
  const oaCount = PUBLICATIONS.filter(p => p.oa).length;
  const years = [...new Set(PUBLICATIONS.map(p => p.year))].sort();
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Publications</div></div>
    <div class="stat-card"><div class="num">${deptCount}</div><div class="label">Departments Involved</div></div>
    <div class="stat-card"><div class="num">${oaCount}</div><div class="label">Open Access</div></div>
    <div class="stat-card"><div class="num">${years.join(', ')}</div><div class="label">Publication Year(s)</div></div>
  `;
}

function renderDeptList() {
  const counts = departmentCounts();
  const depts = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  let html = `<div class="dept-item ${activeDept==='ALL'?'active':''}" data-dept="ALL"><span>All Departments</span><span class="count">${PUBLICATIONS.length}</span></div>`;
  depts.forEach(d => {
    html += `<div class="dept-item ${activeDept===d?'active':''}" data-dept="${d.replace(/"/g,'&quot;')}"><span>${d}</span><span class="count">${counts[d]}</span></div>`;
  });
  document.getElementById('deptList').innerHTML = html;
  document.querySelectorAll('.dept-item').forEach(el => {
    el.addEventListener('click', () => {
      activeDept = el.getAttribute('data-dept');
      renderDeptList();
      renderCards();
    });
  });
}

function renderCards() {
  const searchTerm = document.getElementById('searchBox').value.toLowerCase();

  let list = PUBLICATIONS.filter(p => {
    const matchesDept = activeDept === "ALL" || p.department === activeDept;
    const haystack = (p.title + " " + p.allAuthors + " " + p.source).toLowerCase();
    const matchesSearch = !searchTerm || haystack.includes(searchTerm);
    return matchesDept && matchesSearch;
  });

  list.sort((a,b) => a.department.localeCompare(b.department));

  if (list.length === 0) {
    document.getElementById('cards').innerHTML = `<div id="empty">No publications match your filters.</div>`;
    return;
  }

  document.getElementById('cards').innerHTML = list.map(p => {
    const authorsHtml = p.allAuthors.split(';').map(a => {
      const name = a.trim();
      const isIub = p.iubAuthors.some(iu => name.startsWith(iu) || iu.startsWith(name));
      return isIub ? `<span class="iub">${name}</span>` : name;
    }).join('; ');

    return `
    <div class="pub-card">
      <h3><a href="${p.link}" target="_blank" rel="noopener">${p.title}</a></h3>
      <div class="meta">${p.source} • ${p.year} • DOI: ${p.doi}</div>
      <div>
        <span class="badge dept">🏛️ ${p.department}</span>
        <span class="badge type">${p.type}</span>
        ${p.oa ? `<span class="badge oa">🔓 ${p.oa}</span>` : ''}
      </div>
      <div class="authors">${authorsHtml}</div>
    </div>`;
  }).join('');
}

document.getElementById('searchBox').addEventListener('input', renderCards);

renderStats();
renderDeptList();
renderCards();
